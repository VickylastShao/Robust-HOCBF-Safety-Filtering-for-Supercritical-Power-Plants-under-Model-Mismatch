phase: 5
name: "Primary Delta-g=0 validation on actuator-augmented seven-state CCS"

seeds: [0, 1, 2, 3, 4]
conditions:
  - nominal
  - s1_heat
  - s2_pressure
  - s3_coupled
  - s4_nonlinear
  - s5_valve
  - s6_fuel
methods:
  - fixed_proposal
  - nmpc
  - hocbf_no_gp
  - rocbf_mean
  - rocbf_full

dynamics:
  model: seven_state_actuator_augmented_ccs
  state: [r_B, p_m, h_m, N_e, tau_f, D_fw, u_t]
  load_ratio: 0.66
  controller_period_s: 1.0
  fuel_transport_time_constant_s: 30.0
  feedwater_actuator_time_constant_s: 15.0
  turbine_valve_time_constant_s: 6.0
  rollout: sample_matched_forward_euler_delta_g0
  hocbf_drift_matrix: (A_d-I)/T_s
  hocbf_command_matrix: B_continuous_times_S_u
  input_matrix_assumption: delta_g_equals_zero
  scenario_scales:
    nominal: 0.0
    s1_heat: 0.30
    s2_pressure: 0.24
    s3_coupled: 0.35
    s4_nonlinear: 0.40
    s5_valve: 0.35
    s6_fuel: 0.50

constraints:
  pressure_output_mpa: [13.0, 24.0]
  separator_enthalpy_kj_kg: [2670.0, 2830.0]
  power_band_mw: 50.0
  relative_degrees: [2, 2, 2, 2, 2, 2]
  hocbf_gains: [0.5, 0.5]
  initial_state_set: intersection_of_h_ge_1_and_true_drift_psi1_ge_0

input_coordinates:
  qp_variable: normalized_command_deviation
  component_bounds: [-1.0, 1.0]
  physical_command_scales: [10.0, 40.0, 1.0]
  l2_norm_bound: 1.7320508075688772
  control_coupling_sensitivity: per_state_l2_norm_of_control_row_jacobian
  proposal: fixed_bounded_sinusoidal_deviation_v1

gp:
  inputs: [p_m, h_m, N_e]
  targets: one_step_nominal_model_residual_rates
  outputs: 3
  kernel: matern_5_2
  training_points: 500
  validation_points: 200
  noise_variance: 1.0e-4
  sigma_floor: 1.0e-4
  scenario_specific: true
  frozen_input_standardization: true

qp:
  solver: qpax
  algorithm: implicit_pdip
  float_precision: 64
  row_scaling: true
  feasibility_tolerance: 1.0e-6
  weak_authority_row_drop: false
  rejected_cycle_action: live_upstream_proposal

primary_evaluation:
  episodes_per_seed: 10
  samples_per_episode: 500
  violation_tolerance_raw_margin: 1.0e-2

commissioning_calibration:
  condition: s3_coupled
  tune_seeds: [0, 1, 2]
  holdout_seeds: [3, 4]
  candidates: [0.0, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
  selection: smallest_candidate_passing_all_pooled_and_per_seed_gates
  maximum_violation_rate: 0.01
  maximum_qp_rejection_rate: 0.005

nmpc_reference:
  prediction_horizon: 5
  output_weights: [1.0, 0.001, 0.01]
  input_weights: [0.01, 0.01, 0.01]
  normalized_input_bounds: [-1.0, 1.0]
  additive_disturbance_estimator_gain: 0.5
  warm_start: true
  solver: scipy_slsqp
  max_iterations: 50
  ftol: 1.0e-4
  feasibility_tolerance: 1.0e-6

gp_data_sensitivity:
  training_sizes: [100, 250, 500]
  target_corruption_fractions: [0.0, 0.05, 0.10]
  seeds: [0, 1, 2, 3, 4]
  samples_per_closed_loop_run: 500
